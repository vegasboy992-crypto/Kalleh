<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سفارش‌یار ویزیتور</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:#f2f5f4;color:#1c2b2a;min-height:100vh}
header{background:linear-gradient(135deg,#0e7a5f,#0a5c48);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:1.15rem}
.badge{font-size:.75rem;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid #e3e8e6;position:sticky;top:56px;z-index:4}
nav button{flex-shrink:0;border:none;background:#eef3f1;padding:9px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:.85rem;color:#345}
nav button.active{background:#0e7a5f;color:#fff;font-weight:700}
main{max-width:760px;margin:0 auto;padding:14px 12px 80px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h2{font-size:.95rem;margin-bottom:12px;color:#0a5c48}
input,select{width:100%;padding:10px 12px;border:1.5px solid #d6e0dc;border-radius:10px;font-family:inherit;font-size:.9rem;background:#fbfdfc}
input:focus,select:focus{outline:none;border-color:#0e7a5f}
.stack>*{margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:.92rem;gap:10px}
.row input{width:90px;text-align:center}
.row.final{border-top:2px dashed #dbe6e2;margin-top:6px;padding-top:12px;font-size:1.05rem}
.row.final b{color:#0e7a5f}
button.btn,button.btn-primary,button.btn-geo,button.btn-danger{border:none;border-radius:10px;padding:11px 16px;font-family:inherit;cursor:pointer;font-size:.9rem}
.btn{background:#eef3f1;color:#234}
.btn-primary{background:#0e7a5f;color:#fff;width:100%;font-weight:700;margin-top:10px}
.btn-geo{background:#e8f0ff;color:#1a4fa0}
.btn-danger{background:#fdeaea;color:#a33}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:130px}
.muted{color:#789;font-size:.83rem;line-height:1.9}
.hint{background:#fff8e6;border:1px solid #f3e2ad;color:#8a6d1a;border-radius:10px;padding:8px 12px;font-size:.82rem;margin-bottom:10px}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:10px}
.tbl th{background:#eef3f1;padding:8px 6px;text-align:right;font-size:.78rem}
.tbl td{padding:8px 6px;border-bottom:1px solid #eef2f0;vertical-align:middle}
.tbl input{padding:6px;text-align:center;width:70px}
.price-in{width:110px!important;text-align:center}
.sr-item{display:flex;justify-content:space-between;align-items:center;background:#f7faf9;border:1px solid #e2eae7;border-radius:10px;padding:9px 12px;margin-bottom:8px}
.sr-item b{font-size:.88rem}
.sr-add{background:#0e7a5f;color:#fff;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-family:inherit}
.del{background:none;border:none;color:#c0392b;cursor:pointer;font-size:1.05rem}
.chip{display:inline-block;background:#e8f5f1;color:#0a5c48;border-radius:99px;padding:2px 10px;font-size:.75rem;margin-inline-start:6px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat .n{font-size:1.3rem;font-weight:800;color:#0e7a5f}
.stat .l{font-size:.75rem;color:#789;margin-top:4px}
.order-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:.86rem}
.order-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.order-card .top b{color:#0a5c48;font-size:.95rem}
.order-card .meta{color:#667;line-height:2}
.order-card .items{background:#f7faf9;border-radius:10px;padding:8px 12px;margin:8px 0;line-height:2.1;font-size:.82rem}
.order-card .money{display:flex;justify-content:space-between;border-top:1px dashed #dbe6e2;padding-top:8px;margin-top:4px}
.order-card .money b{color:#0e7a5f}
.acard{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:.86rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{text-align:center;color:#9ab;padding:30px 10px;font-size:.9rem}
a{color:#0e7a5f}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#1c2b2a;color:#fff;padding:11px 22px;border-radius:99px;font-size:.85rem;opacity:0;transition:.3s;z-index:99;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#receipt{display:none}
@media print{
  body>*{display:none!important}
  #receipt{display:block!important;position:absolute;inset:0;padding:20px;font-size:.9rem;line-height:2}
  #receipt table{width:100%;border-collapse:collapse;margin:10px 0}
  #receipt th,#receipt td{border:1px solid #999;padding:6px}
}
@media(max-width:480px){nav{top:52px}nav button{padding:8px 11px;font-size:.78rem}}
</style>
</head>
<body>
<header>
  <h1>🧾 سفارش‌یار</h1>
  <div id="visitorBadge" class="badge"></div>
</header>
<nav id="tabs">
  <button data-tab="dash" class="active">🏠 داشبورد</button>
  <button data-tab="new">🛒 سفارش جدید</button>
  <button data-tab="catalog">📋 کاتالوگ</button>
  <button data-tab="customers">🏪 مغازه‌ها</button>
  <button data-tab="orders">🗂 سفارش‌ها</button>
  <button data-tab="settings">⚙️ تنظیمات</button>
</nav>
<main>
  <section id="tab-dash"></section>

  <section id="tab-new" hidden>
    <div class="card">
      <h2>🏪 مغازه / خریدار</h2>
      <select id="custSelect" onchange="onCustomerSelect(this.value)"></select>
      <div id="newCustBox" hidden class="stack" style="margin-top:10px">
        <input id="ncName" placeholder="نام مغازه / خریدار">
        <input id="ncPhone" type="tel" inputmode="tel" placeholder="شماره تماس">
        <input id="ncCode" placeholder="کد مشتری (اختیاری)">
      </div>
      <div id="custInfo" class="muted" style="margin-top:8px" hidden></div>
    </div>
    <div class="card">
      <h2>📍 موقعیت مکان</h2>
      <button onclick="grabGeo()" class="btn-geo">📡 ثبت موقعیت فعلی من</button>
      <div id="geoBox" class="muted" style="margin-top:8px">هنوز موقعیتی ثبت نشده</div>
    </div>
    <div class="card">
      <h2>🛍 کالاها</h2>
      <input id="prodSearch" placeholder="🔍 جستجوی نام یا کد کالا..." oninput="renderSearch()">
      <div id="searchResults" style="margin-top:8px"></div>
      <div id="cartWrap"><table id="cartTable" class="tbl"></table></div>
    </div>
    <div class="card">
      <h2>🧮 تسویه</h2>
      <div id="discHint" class="hint" hidden></div>
      <div class="row"><span>جمع کل:</span><b id="sumTotal">۰</b></div>
      <div class="row">درصد تخفیف این سفارش:
        <input id="discInput" type="number" min="0" max="100" value="0" oninput="updateTotals()">
      </div>
      <div class="row"><span>مبلغ تخفیف:</span><b id="sumDisc">۰</b></div>
      <div class="row final"><span>مبلغ نهایی:</span><b id="sumFinal">۰</b></div>
      <button onclick="submitOrder()" class="btn-primary">✅ ثبت سفارش</button>
    </div>
  </section>

  <section id="tab-catalog"></section>
  <section id="tab-customers"></section>
  <section id="tab-orders"></section>

  <section id="tab-settings" hidden>
    <div class="card">
      <h2>👤 مشخصات ویزیتور</h2>
      <div class="stack">
        <label>نام ویزیتور<input id="stName" placeholder="مثلاً: علی محمدی"></label>
        <label>کد فروشنده (ویزیتور)<input id="stCode" placeholder="مثلاً: V-123"></label>
      </div>
      <button onclick="saveSettings()" class="btn-primary">ذخیره</button>
    </div>
    <div class="card">
      <h2>💾 پشتیبان‌گیری</h2>
      <p class="muted">داده‌ها در همین مرورگر گوشی/کامپیوتر شما ذخیره می‌شود. هر از گاهی خروجی بگیرید.</p>
      <div class="btnrow">
        <button onclick="exportJSON()" class="btn">دانلود بکاپ (JSON)</button>
        <button onclick="document.getElementById('importFile').click()" class="btn">بازیابی از بکاپ</button>
        <button onclick="exportCSV()" class="btn">خروجی سفارش‌ها (CSV)</button>
      </div>
    </div>
    <div class="card">
      <h2>🗑 پاک‌سازی</h2>
      <button onclick="wipeAll()" class="btn-danger">حذف کامل همه داده‌ها</button>
    </div>
  </section>
</main>
<div id="receipt"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json" hidden onchange="importJSON(this)">
<script>
'use strict';
const LS_KEY='safarshyar_v1';
let state=load();
let cart=[], orderGeo=null, currentCustomer='', newCust=false;

function load(){
  try{const s=JSON.parse(localStorage.getItem(LS_KEY));
    if(s&&Array.isArray(s.products))return s;
  }catch(e){}
  return {settings:{visitorName:'',visitorCode:''},products:[],customers:[],orders:[],orderSeq:1,dailyDiscount:{percent:0,note:''}};
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){toast('⚠️ ذخیره دائمی ممکن نشد — داده‌ها موقتی‌اند')}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fa(n){return Number(n||0).toLocaleString('fa-IR')}
const dateFmt=new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'});
const timeFmt=new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'});
const todayFa=function(d){return dateFmt.format(d||new Date())};
const timeFa=function(d){return timeFmt.format(d||new Date())};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},2600)}
function toman(n){return fa(n)+' تومان'}
function el(id){return document.getElementById(id)}

/* ---------- تب‌ها ---------- */
function switchTab(t){
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('active',b.dataset.tab===t)});
  ['dash','new','catalog','customers','orders','settings'].forEach(function(x){el('tab-'+x).hidden=(x!==t)});
  if(t==='dash')renderDash();
  if(t==='new')renderNewOrder();
  if(t==='catalog')renderCatalog();
  if(t==='customers')renderCustomers();
  if(t==='orders')renderOrders();
  if(t==='settings')renderSettings();
}
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){switchTab(b.dataset.tab)}});

/* ---------- داشبورد ---------- */
function renderDash(){
  const today=todayFa();
  const todays=state.orders.filter(function(o){return o.date===today});
  const sumToday=todays.reduce(function(a,o){return a+o.finalTotal},0);
  const dates=state.products.map(function(p){return p.priceDate}).filter(Boolean).sort();
  const lastPrice=dates.length?dates[dates.length-1]:null;
  el('tab-dash').innerHTML=
  '<div class="stat-grid">'+
    '<div class="stat"><div class="n">'+fa(todays.length)+'</div><div class="l">سفارش امروز</div></div>'+
    '<div class="stat"><div class="n">'+fa(sumToday)+'</div><div class="l">فروش امروز (تومان)</div></div>'+
    '<div class="stat"><div class="n">'+fa(state.orders.length)+'</div><div class="l">کل سفارش‌ها</div></div>'+
    '<div class="stat"><div class="n">'+fa(state.customers.length)+'</div><div class="l">مغازه‌های ثبت‌شده</div></div>'+
  '</div>'+
  '<div class="card"><h2>📌 وضعیت امروز</h2>'+
    '<div class="row"><span>تخفیف فعال:</span><b>'+(state.dailyDiscount.percent?fa(state.dailyDiscount.percent)+'٪'+(state.dailyDiscount.note?' — '+esc(state.dailyDiscount.note):''):'بدون تخفیف')+'</b></div>'+
    '<div class="row"><span>آخرین به‌روزرسانی قیمت‌ها:</span><b>'+(lastPrice?esc(lastPrice):'—')+'</b></div>'+
    '<div class="row"><span>تعداد کالاهای کاتالوگ:</span><b>'+fa(state.products.length)+'</b></div>'+
    '<button class="btn-primary" onclick="switchTab(\'new\')">➕ ثبت سفارش جدید</button>'+
  '</div>'+
  '<div class="card"><h2>🆕 آخرین سفارش‌ها</h2>'+
    (state.orders.slice(0,4).map(function(o){
      return '<div class="row"><span><b>'+esc(o.customerName)+'</b> — '+esc(o.date)+'</span><b>'+toman(o.finalTotal)+'</b></div>';
    }).join('')||'<div class="empty">هنوز سفارشی ثبت نشده</div>')+
  '</div>';
}

/* ---------- کاتالوگ ---------- */
function renderCatalog(){
  const d=state.dailyDiscount;
  el('tab-catalog').innerHTML=
  '<div class="card"><h2>💸 تخفیف امروز</h2>'+
    '<div class="row">درصد تخفیف پیش‌فرض روز: <input type="number" id="ddPercent" min="0" max="100" value="'+d.percent+'" style="width:80px"></div>'+
    '<input id="ddNote" placeholder="یادداشت (مثلاً: تخفیف ویژه پنجشنبه‌ها)" value="'+esc(d.note)+'" style="margin-bottom:10px">'+
    '<button class="btn-primary" onclick="setDiscount()">ذخیره تخفیف روز</button>'+
  '</div>'+
  '<div class="card"><h2>➕ افزودن کالا</h2>'+
    '<div class="stack">'+
      '<input id="pName" placeholder="نام کالا">'+
      '<div style="display:flex;gap:8px"><input id="pCode" placeholder="کد کالا"><input id="pUnit" placeholder="واحد (کارتن/عدد)"></div>'+
      '<input id="pPrice" type="number" placeholder="قیمت (تومان)">'+
      '<button class="btn-primary" onclick="addProduct()">افزودن به کاتالوگ</button>'+
    '</div>'+
  '</div>'+
  '<div class="card"><h2>📋 قیمت‌های امروز</h2>'+
    '<input id="catSearch" placeholder="🔍 جستجو..." oninput="filterCatalog(this.value)" style="margin-bottom:8px">'+
    '<div id="catalogList"></div>'+
  '</div>';
  renderCatalogList('');
}
function renderCatalogList(q){
  const list=state.products.filter(function(p){return !q||p.name.includes(q)||String(p.code).includes(q)});
  el('catalogList').innerHTML=list.length?
    '<table class="tbl"><tr><th>کالا</th><th>قیمت (تومان)</th><th>بروزرسانی</th><th></th></tr>'+
    list.map(function(p){
      return '<tr><td><b>'+esc(p.name)+'</b><br><span class="muted">'+esc(p.code||'')+(p.unit?' — '+esc(p.unit):'')+'</span></td>'+
      '<td><input type="number" class="price-in" value="'+p.price+'" onchange="updatePrice(\''+p.id+'\',this.value)"></td>'+
      '<td class="muted">'+esc(p.priceDate||'—')+'</td>'+
      '<td><button class="del" onclick="delProduct(\''+p.id+'\')">🗑</button></td></tr>';
    }).join('')+'</table>':'<div class="empty">کالایی نیست — از فرم بالا اضافه کنید</div>';
}
function filterCatalog(q){renderCatalogList(q.trim())}
function addProduct(){
  const name=el('pName').value.trim();
  if(!name){toast('نام کالا را بنویسید');return}
  state.products.push({id:uid(),name:name,code:el('pCode').value.trim(),unit:el('pUnit').value.trim(),price:+el('pPrice').value||0,priceDate:todayFa()});
  save();el('pName').value='';el('pCode').value='';el('pUnit').value='';el('pPrice').value='';
  renderCatalogList(el('catSearch').value.trim());toast('کالا به کاتالوگ اضافه شد ✅');
}
function updatePrice(id,v){
  const p=state.products.find(function(x){return x.id===id});if(!p)return;
  p.price=+v||0;p.priceDate=todayFa();save();
  renderCatalogList(el('catSearch')?el('catSearch').value.trim():'');
  toast('قیمت «'+p.name+'» برای امروز ثبت شد ✅');
}
function delProduct(id){
  if(!confirm('این کالا از کاتالوگ حذف شود؟'))return;
  state.products=state.products.filter(function(p){return p.id!==id});save();renderCatalogList('');
}
function setDiscount(){
  state.dailyDiscount={percent:+el('ddPercent').value||0,note:el('ddNote').value.trim()};
  save();toast('تخفیف امروز ذخیره شد ✅');
}

/* ---------- مغازه‌ها ---------- */
function renderCustomers(){
  el('tab-customers').innerHTML='<div class="card"><h2>🏪 دفترچه مغازه‌ها</h2>'+
    (state.customers.length?state.customers.map(function(c){
      const cnt=state.orders.filter(function(o){return o.customerId===c.id}).length;
      const withGeo=state.orders.filter(function(o){return o.customerId===c.id&&o.lat});
      const last=withGeo.length?withGeo[withGeo.length-1]:null;
      return '<div class="acard"><div><b>'+esc(c.name)+'</b>'+(c.code?'<span class="chip">کد: '+esc(c.code)+'</span>':'')+
        '<div class="muted">📞 '+esc(c.phone||'—')+' — '+fa(cnt)+' سفارش'+
        (last?'<br>📍 آخرین مکان: <a href="https://www.google.com/maps?q='+last.lat+','+last.lng+'" target="_blank" rel="noopener">نمایش روی نقشه</a>':'')+'</div></div>'+
        '<div style="display:flex;flex-direction:column;gap:6px">'+
        '<button class="sr-add" onclick="orderForCustomer(\''+c.id+'\')">سفارش</button>'+
        '<button class="del" onclick="delCustomer(\''+c.id+'\')">🗑</button></div></div>';
    }).join(''):'<div class="empty">هنوز مغازه‌ای ثبت نشده — هنگام اولین سفارش ذخیره می‌شود</div>')+'</div>';
}
function delCustomer(id){
  if(!confirm('این مغازه از دفترچه حذف شود؟ (سفارش‌های قبلی باقی می‌مانند)'))return;
  state.customers=state.customers.filter(function(c){return c.id!==id});save();renderCustomers();
}
function orderForCustomer(id){switchTab('new');el('custSelect').value=id;onCustomerSelect(id)}

/* ---------- فرم سفارش جدید ---------- */
function renderNewOrder(){
  el('custSelect').innerHTML='<option value="">— انتخاب مغازه —</option><option value="__new">➕ مغازه جدید...</option>'+
    state.customers.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+(c.code?' ('+esc(c.code)+')':'')+'</option>'}).join('');
  if(currentCustomer&&state.customers.some(function(c){return c.id===currentCustomer}))el('custSelect').value=currentCustomer;
  onCustomerSelect(el('custSelect').value);
  const d=state.dailyDiscount;
  if(d.percent){el('discHint').hidden=false;el('discHint').textContent='💡 امروز تخفیف '+fa(d.percent)+'٪ فعال است'+(d.note?' ('+d.note+')':'')+' — در فرم پایین اعمالش کنید.'}
  updateCart();
}
function onCustomerSelect(v){
  currentCustomer=(v==='__new')?'':v;newCust=(v==='__new');
  el('newCustBox').hidden=!newCust;
  const c=state.customers.find(function(x){return x.id===v});
  el('custInfo').hidden=!c;
  if(c){
    const withGeo=state.orders.filter(function(o){return o.customerId===c.id&&o.lat});
    const last=withGeo.length?withGeo[withGeo.length-1]:null;
    el('custInfo').innerHTML='📞 '+esc(c.phone||'—')+(c.code?' — کد: '+esc(c.code):'')+
      (last?' — <a href="https://www.google.com/maps?q='+last.lat+','+last.lng+'" target="_blank" rel="noopener">📍 مکان قبلی</a>':'');
  }
}
function grabGeo(){
  if(!navigator.geolocation){toast('مرورگر شما موقعیت‌یاب ندارد');return}
  toast('در حال دریافت موقعیت...');
  navigator.geolocation.getCurrentPosition(function(p){
    orderGeo={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)};
    showGeo();toast('موقعیت ثبت شد 📍');
  },function(){toast('دسترسی به موقعیت داده نشد — مجوز Location را فعال کنید')},{enableHighAccuracy:true,timeout:12000});
}
function showGeo(){
  el('geoBox').innerHTML=orderGeo
    ?'✅ ثبت شد — دقت ±'+fa(orderGeo.acc)+' متر<br><a href="https://www.google.com/maps?q='+orderGeo.lat+','+orderGeo.lng+'" target="_blank" rel="noopener">مشاهده روی نقشه</a>'
    :'هنوز موقعیتی ثبت نشده';
}
function renderSearch(){
  const q=el('prodSearch').value.trim();
  const box=el('searchResults');
  if(!q){box.innerHTML='';return}
  const list=state.products.filter(function(p){return p.name.includes(q)||String(p.code).includes(q)}).slice(0,6);
  box.innerHTML=list.length?list.map(function(p){
    return '<div class="sr-item"><span><b>'+esc(p.name)+'</b> <span class="muted">'+esc(p.code||'')+'</span><br>'+
      '<span class="muted">'+toman(p.price)+(p.unit?' / '+esc(p.unit):'')+'</span></span>'+
      '<button class="sr-add" onclick="addToCart(\''+p.id+'\')">+ افزودن</button></div>';
  }).join(''):'<div class="empty">کالایی با این نام پیدا نشد</div>';
}
function addToCart(pid){
  const p=state.products.find(function(x){return x.id===pid});if(!p)return;
  const ex=cart.find(function(i){return i.pid===pid});
  if(ex)ex.qty++;else cart.push({pid:pid,name:p.name,code:p.code,unit:p.unit,price:p.price,qty:1});
  el('prodSearch').value='';el('searchResults').innerHTML='';
  updateCart();
}
function chQty(pid,v){const i=cart.find(function(x){return x.pid===pid});if(i)i.qty=Math.max(1,+v||1);updateCart()}
function rmCart(pid){cart=cart.filter(function(x){return x.pid!==pid});updateCart()}
function cartTotal(){return cart.reduce(function(a,i){return a+i.price*i.qty},0)}
function updateCart(){
  el('cartWrap').innerHTML='<table class="tbl">'+(cart.length?
    '<tr><th>کالا</th><th>قیمت</th><th>تعداد</th><th>جمع</th><th></th></tr>'+
    cart.map(function(i){
      return '<tr><td><b>'+esc(i.name)+'</b></td><td class="muted">'+fa(i.price)+'</td>'+
      '<td><input type="number" min="1" value="'+i.qty+'" onchange="chQty(\''+i.pid+'\',this.value)"></td>'+
      '<td><b>'+fa(i.price*i.qty)+'</b></td>'+
      '<td><button class="del" onclick="rmCart(\''+i.pid+'\')">✖</button></td></tr>';
    }).join(''):'<tr><td class="empty">سبد خالی است — از جستجوی بالا کالا اضافه کنید</td></tr>')+'</table>';
  updateTotals();
}
function updateTotals(){
  const total=cartTotal(),disc=Math.round(total*(+el('discInput').value||0)/100);
  el('sumTotal').textContent=fa(total);el('sumDisc').textContent=fa(disc);el('sumFinal').textContent=fa(total-disc);
}
function submitOrder(){
  if(!cart.length){toast('هیچ کالایی انتخاب نشده است');return}
  let name,phone='',code='',cid=null;
  if(newCust){
    name=el('ncName').value.trim();
    if(!name){toast('نام مغازه / خریدار را بنویسید');return}
    phone=el('ncPhone').value.trim();code=el('ncCode').value.trim();
    cid=uid();state.customers.push({id:cid,name:name,phone:phone,code:code});
  }else{
    const c=state.customers.find(function(x){return x.id===currentCustomer});
    if(!c){toast('مغازه را انتخاب کنید');return}
    name=c.name;phone=c.phone;code=c.code;cid=c.id;
  }
  if(!orderGeo&&!confirm('موقعیت مکانی ثبت نشده! سفارش بدون مکان ثبت شود؟'))return;
  const total=cartTotal(),discPct=+el('discInput').value||0,discAmt=Math.round(total*discPct/100);
  const o={id:uid(),no:state.orderSeq++,customerId:cid,customerName:name,customerPhone:phone,customerCode:code,
    date:todayFa(),time:timeFa(),ts:Date.now(),
    lat:orderGeo?orderGeo.lat:null,lng:orderGeo?orderGeo.lng:null,
    items:cart.map(function(i){return{name:i.name,code:i.code,unit:i.unit,price:i.price,qty:i.qty}}),
    total:total,discount:discPct,discountAmount:discAmt,finalTotal:total-discAmt,
    visitor:state.settings.visitorName||'',visitorCode:state.settings.visitorCode||''};
  state.orders.unshift(o);save();
  cart=[];orderGeo=null;
  toast('سفارش شماره '+fa(o.no)+' ثبت شد ✅');
  printReceipt(o.id);
  switchTab('dash');
}

/* ---------- سفارش‌ها ---------- */
function renderOrders(){
  el('tab-orders').innerHTML='<div class="btnrow" style="margin-bottom:12px">'+
    '<button class="btn" onclick="exportCSV()">⬇️ خروجی CSV (اکسل)</button></div>'+
    '<div id="ordersList">'+
    (state.orders.length?state.orders.map(function(o){
      return '<div class="order-card">'+
      '<div class="top"><b>سفارش #'+fa(o.no)+'</b><span class="muted">'+esc(o.date)+' — '+esc(o.time)+'</span></div>'+
      '<div class="meta">🏪 <b>'+esc(o.customerName)+'</b>'+(o.customerCode?' — کد: '+esc(o.customerCode):'')+
        (o.customerPhone?'<br>📞 <a href="tel:'+esc(o.customerPhone)+'">'+esc(o.customerPhone)+'</a>':'')+
        (o.lat?'<br>📍 <a href="https://www.google.com/maps?q='+o.lat+','+o.lng+'" target="_blank" rel="noopener">موقعیت روی نقشه</a>':'<br>📍 بدون موقعیت مکانی')+
        '<br>👤 ویزیتور: '+esc(o.visitor||'—')+(o.visitorCode?' ('+esc(o.visitorCode)+')':'')+'</div>'+
      '<div class="items">'+o.items.map(function(i){return esc(i.name)+' × '+fa(i.qty)+(i.unit?' '+esc(i.unit):'')+' = '+fa(i.price*i.qty)}).join('<br>')+'</div>'+
      '<div class="money"><span>'+toman(o.total)+(o.discount?' — تخفیف '+fa(o.discount)+'٪ (−'+fa(o.discountAmount)+')':'')+'</span><b>'+toman(o.finalTotal)+'</b></div>'+
      '<div class="btnrow" style="margin-top:10px">'+
        '<button class="btn" onclick="printReceipt(\''+o.id+'\')">🖨 چاپ رسید</button>'+
        '<button class="btn-danger" onclick="delOrder(\''+o.id+'\')">🗑 حذف</button></div></div>';
    }).join(''):'<div class="empty">هنوز سفارشی ثبت نشده</div>')+'</div>';
}
function delOrder(id){
  if(!confirm('این سفارش حذف شود؟'))return;
  state.orders=state.orders.filter(function(o){return o.id!==id});save();renderOrders();
}
function printReceipt(id){
  const o=state.orders.find(function(x){return x.id===id});if(!o)return;
  el('receipt').innerHTML=
  '<h2 style="text-align:center">رسید سفارش شماره '+fa(o.no)+'</h2>'+
  '<p>تاریخ: '+esc(o.date)+' — ساعت: '+esc(o.time)+'<br>'+
  'خریدار: '+esc(o.customerName)+(o.customerCode?' (کد: '+esc(o.customerCode)+')':'')+' — تلفن: '+esc(o.customerPhone||'—')+'<br>'+
  'ویزیتور: '+esc(o.visitor||'—')+' '+(o.visitorCode?'('+esc(o.visitorCode)+')':'')+'<br>'+
  'موقعیت: '+(o.lat?o.lat+','+o.lng:'ثبت نشده')+'</p>'+
  '<table><tr><th>کالا</th><th>قیمت</th><th>تعداد</th><th>جمع</th></tr>'+
  o.items.map(function(i){return '<tr><td>'+esc(i.name)+'</td><td>'+fa(i.price)+'</td><td>'+fa(i.qty)+'</td><td>'+fa(i.price*i.qty)+'</td></tr>'}).join('')+
  '<tr><td colspan="3">جمع کل</td><td>'+fa(o.total)+'</td></tr>'+
  (o.discount?'<tr><td colspan="3">تخفیف '+fa(o.discount)+'٪</td><td>−'+fa(o.discountAmount)+'</td></tr>':'')+
  '<tr><td colspan="3"><b>مبلغ نهایی</b></td><td><b>'+fa(o.finalTotal)+'</b></td></tr></table>'+
  '<p style="text-align:center">با تشکر از خرید شما 🌹</p>';
  window.print();
}

/* ---------- تنظیمات و خروجی‌ها ---------- */
function renderSettings(){
  el('stName').value=state.settings.visitorName||'';
  el('stCode').value=state.settings.visitorCode||'';
  el('visitorBadge').textContent=state.settings.visitorName?('👤 '+state.settings.visitorName+(state.settings.visitorCode?' — '+state.settings.visitorCode:'')):'';
}
function saveSettings(){
  state.settings.visitorName=el('stName').value.trim();
  state.settings.visitorCode=el('stCode').value.trim();
  save();renderSettings();toast('مشخصات ذخیره شد ✅');
}
function download(name,content,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:type}));a.download=name;a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}
function exportJSON(){
  download('safarshyar-backup.json',JSON.stringify(state,null,2),'application/json');
  toast('فایل بکاپ دانلود شد 💾');
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const s=JSON.parse(r.result);
      if(!s.products||!s.orders)throw new Error('bad');
      state=s;save();toast('بکاپ بازیابی شد ✅');switchTab('dash');
    }catch(e){toast('فایل بکاپ معتبر نیست')}
  };
  r.readAsText(f);inp.value='';
}
function exportCSV(){
  if(!state.orders.length){toast('سفارشی برای خروجی نیست');return}
  const rows=;
  state.orders.forEach(function(o){
    rows.push([o.no,o.date,o.time,o.customerName,o.customerCode||'',o.customerPhone||'',
      (o.lat&&o.lng)?(o.lat+','+o.lng):'',
      (o.lat&&o.lng)?('https://www.google.com/maps?q='+o.lat+','+o.lng):'',
      o.items.map(function(i){return i.name+' ×'+i.qty}).join(' | '),
      o.total,o.discount,o.discountAmount,o.finalTotal,o.visitor||'',o.visitorCode||'']);
  });
  const csv='\uFEFF'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  download('orders.csv',csv,'text/csv;charset=utf-8');
  toast('فایل CSV آماده شد — قابل باز کردن در اکسل 📊');
}
function wipeAll(){
  if(!confirm('همه محصولات، مغازه‌ها و سفارش‌ها برای همیشه حذف شوند؟'))return;
  if(!confirm('مطمئنید؟ قبل از این کار خروجی بگیرید!'))return;
  try{localStorage.removeItem(LS_KEY)}catch(e){}
  state=load();cart=[];orderGeo=null;
  toast('همه داده‌ها پاک شد');switchTab('dash');
}

/* ---------- شروع ---------- */
showGeo();
renderSettings();
switchTab('dash');
</script>
